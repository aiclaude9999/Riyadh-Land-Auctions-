<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مزادات أراضي الرياض</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: sticky header with view tabs, filter row, then a responsive card grid. Earth tones for land, deep green for the brand. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --fg: #18211d; --muted: #5f6d66; --line: #dfe5e1;
  --brand: #0f5f46; --brand-ink: #ffffff; --land: #8a5a1f; --land-bg: #f6ecdc;
  --live: #0f7a4c; --live-bg: #dff3e8; --soon: #1d5f9e; --soon-bg: #e1edf9; --urgent: #b42318;
  --f-display: 'Readex Pro', 'IBM Plex Sans Arabic', Tahoma, sans-serif;
  --f-body: 'IBM Plex Sans Arabic', Tahoma, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #161e1b; --fg: #e6eee9; --muted: #98a8a0; --line: #26312c;
  --brand: #3fae86; --brand-ink: #07140f; --land: #e0b073; --land-bg: #3a2c19;
  --live: #5fd39b; --live-bg: #123526; --soon: #8cbcf0; --soon-bg: #142a40; --urgent: #ff8a7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #161e1b; --fg: #e6eee9; --muted: #98a8a0; --line: #26312c;
  --brand: #3fae86; --brand-ink: #07140f; --land: #e0b073; --land-bg: #3a2c19;
  --live: #5fd39b; --live-bg: #123526; --soon: #8cbcf0; --soon-bg: #142a40; --urgent: #ff8a7a; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0 }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.hrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; color: var(--brand); display: flex; align-items: center; gap: 8px }
.brand i { font-style: normal; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font-size: 15px }
nav { display: flex; gap: 4px; overflow-x: auto; flex: 1 }
nav a { white-space: nowrap; text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-weight: 600 }
nav a[aria-current="page"] { background: var(--land-bg); color: var(--land) }
nav a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px }
main { padding-block: 18px 48px; display: grid; gap: 16px }
h1 { font-family: var(--f-display); font-size: 22px; margin: 0; text-wrap: balance }
.sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 0 }
.note { background: var(--land-bg); color: var(--fg); border-radius: 10px; padding: 10px 14px; font-size: 13px }
.note b { color: var(--land) }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
.stat span { color: var(--muted); font-size: 12px; display: block }
.stat b { font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px }
.seg button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 7px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink) }
input, select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0 }
input[type=search] { flex: 1 1 220px }
.num-in { width: 110px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--land); border-color: var(--land); color: #fff }
.chip small { opacity: .7; font-variant-numeric: tabular-nums }
.count { color: var(--muted); font-size: 13px }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.card.has-img { padding: 0; overflow: hidden }
.card.has-img .body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0 }
.thumb { display: block; aspect-ratio: 16 / 9; max-width: 100%; background: var(--land-bg); position: relative }
.thumb img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 42px; opacity: .6 }
.card.side { flex-direction: row }
.card.side .thumb { aspect-ratio: auto; width: 30%; min-width: 100px; flex: none }
@media (max-width: 480px) { .card.side { flex-direction: column } .card.side .thumb { width: 100%; aspect-ratio: 16 / 9 } }
.tags { display: flex; flex-wrap: wrap; gap: 5px }
.tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted) }
.tag.live { background: var(--live-bg); color: var(--live); border-color: transparent }
.tag.upcoming { background: var(--soon-bg); color: var(--soon); border-color: transparent }
.tag.land { background: var(--land-bg); color: var(--land); border-color: transparent }
.tag.multi { color: var(--brand); border-color: var(--brand) }
.card h3 { margin: 0; font-size: 15.5px; line-height: 1.4; overflow-wrap: anywhere }
.loc, .org { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; font-variant-numeric: tabular-nums }
.kv div span { display: block; color: var(--muted); font-size: 11.5px }
.kv div b { font-size: 12.5px; white-space: nowrap }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; margin-top: auto; font-size: 12.5px }
.cd { font-weight: 700; color: var(--live); font-variant-numeric: tabular-nums }
.cd.urgent { color: var(--urgent) }
a.src { color: var(--brand); font-weight: 600; text-decoration: none }
a.src:hover { text-decoration: underline }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 36px; text-align: center; color: var(--muted) }
.srcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 6px }
.ok { background: var(--live) } .blocked { background: #d99a1c } .error { background: var(--urgent) }
.err { font-size: 12px; color: var(--urgent); overflow-wrap: anywhere; direction: ltr; text-align: left }
.more { justify-self: center; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 10px; cursor: pointer }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>


<div dir="rtl" lang="ar">
<header><div class="wrap hrow">
  <div class="brand"><i>⚖</i>مزادات أراضي الرياض</div>
  <nav aria-label="الأقسام">
    <a href="#lands" data-v="lands">الأراضي</a>
    <a href="#properties" data-v="properties">العقارات</a>
    <a href="#all" data-v="all">كل المزادات</a>
    <a href="#sources" data-v="sources">المصادر</a>
  </nav>
</div></header>

<main class="wrap">
  <div>
    <h1 id="title">مزادات الأراضي</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="note">بيانات حقيقية من منصات المزادات، <b>تتحدث تلقائياً كل ساعة</b>. آخر تحديث: <b id="snap"></b> (بتوقيت الرياض). كل بطاقة تربطك بالمزاد الأصلي في منصته.</div>
  <section class="stats" id="stats" aria-label="ملخص"></section>
  <div class="bar" id="controls">
    <div class="seg" id="geo" role="group" aria-label="النطاق الجغرافي">
      <button data-g="city" aria-pressed="true">مدينة الرياض</button>
      <button data-g="region" aria-pressed="false">منطقة الرياض</button>
      <button data-g="all" aria-pressed="false">كل المملكة</button>
    </div>
    <input type="search" id="q" placeholder="ابحث بالاسم أو الحي أو الجهة…" aria-label="بحث">
    <select id="status" aria-label="الحالة"><option value="">جاري + قادم</option><option value="live">جاري</option><option value="upcoming">قادم</option></select>
    <select id="usage" aria-label="الاستخدام"><option value="">كل الاستخدامات</option></select>
    <input class="num-in" id="amin" inputmode="numeric" placeholder="المساحة من م²" aria-label="أقل مساحة">
    <input class="num-in" id="amax" inputmode="numeric" placeholder="إلى م²" aria-label="أكبر مساحة">
    <select id="sort" aria-label="الترتيب">
      <option value="ending">الأقرب إغلاقاً</option><option value="price_asc">الأقل سعراً</option><option value="price_desc">الأعلى سعراً</option>
      <option value="area_desc">الأكبر مساحة</option><option value="area_asc">الأصغر مساحة</option>
    </select>
  </div>
  <div class="chips" id="types" hidden></div>
  <div class="count" id="count"></div>
  <section class="grid" id="list" aria-live="polite"></section>
  <button class="more" id="more" hidden>عرض المزيد</button>
  <section class="srcs" id="srcs" hidden></section>
</main>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const AUC = Object.fromEntries(D.auctions.map(a => [a.i, a]));
const SRC = { 'mobasher': 'مباشر', 'saudia-auctions': 'السعودية للمزادات', 'mazadat': 'مزادات', 'tarsyah': 'ترسية', 'qemah': 'قمة', 'infath': 'إنفاذ', 'wasalt': 'وصلت', 'athmann': 'أثمان' };
const PT = { land: ['أرض', '🟫'], villa: ['فيلا', '🏡'], apartment: ['شقة', '🏢'], building: ['عمارة / مبنى', '🏬'], rest_house: ['استراحة', '🏕️'], farm: ['مزرعة', '🌴'], commercial: ['تجاري', '🏪'], other: ['أخرى', '🏠'] };
const US = { residential: 'سكني', commercial: 'تجاري', agricultural: 'زراعي', industrial: 'صناعي', mixed: 'متعدد الاستخدام', other: 'أخرى' };
const CAT = { real_estate: 'عقار', vehicle: 'سيارات', equipment: 'معدات', scrap: 'سكراب', collectible: 'مقتنيات', other: 'أخرى' };
const ST = { live: 'جاري', upcoming: 'قادم', ended: 'منتهي' };
const nf = new Intl.NumberFormat('ar-SA-u-nu-latn', { maximumFractionDigits: 0 });
const df = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', { timeZone: 'Asia/Riyadh', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
const money = n => n == null ? '—' : nf.format(n) + ' ر.س';
const area = n => n == null ? '—' : nf.format(n) + ' م²';
const date = s => s ? df.format(new Date(s)) : '—';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);

const S = { view: 'lands', geo: 'city', type: '', shown: 30 };
try { const g = localStorage.getItem('geo'); if (g) S.geo = g; } catch {}

for (const [k, v] of Object.entries(US)) $('usage').insertAdjacentHTML('beforeend', `<option value="${k}">${v}</option>`);
$('snap').textContent = date(D.at);

function inGeo(rc, rr) { return S.geo === 'all' || (S.geo === 'city' ? rc : rr); }
function assetGeo(x) {
  if (x.g === 'unknown') { const a = AUC[x.ai]; return a ? inGeo(a.rc, a.rr) : S.geo === 'all'; }
  return S.geo === 'all' || x.g === 'riyadh_city' || (S.geo === 'region' && x.g === 'riyadh_region');
}
const val = id => $(id).value.trim();
const numv = id => { const v = Number(val(id)); return val(id) && isFinite(v) ? v : null; };

function filtAuctions() {
  const q = val('q'), st = val('status'), us = val('usage'), amin = numv('amin'), amax = numv('amax');
  return D.auctions.filter(a =>
    (S.view !== 'lands' || a.L) && inGeo(a.rc, a.rr) && (!st || a.s === st) && (!us || a.u.includes(us)) &&
    (amin == null || (a.la ?? -1) >= amin) && (amax == null || (a.la != null && a.la <= amax)) &&
    (!q || [a.t, a.o, a.d, ...a.ci].join(' ').includes(q)));
}
function filtAssets(ignoreType) {
  const q = val('q'), st = val('status'), us = val('usage'), amin = numv('amin'), amax = numv('amax');
  return D.assets.filter(x =>
    assetGeo(x) && (ignoreType || !S.type || (x.pt ?? 'other') === S.type) && (!st || x.as === st) && (!us || x.u === us) &&
    (amin == null || (x.ar ?? -1) >= amin) && (amax == null || (x.ar != null && x.ar <= amax)) &&
    (!q || [x.t, x.at, x.d, x.ci].join(' ').includes(q)));
}
function sortBy(arr, price, ar, end) {
  const k = val('sort'), big = 9e15;
  const f = { ending: x => +new Date(end(x) || big), price_asc: x => price(x) ?? big, price_desc: x => -(price(x) ?? -big), area_desc: x => -(ar(x) ?? -big), area_asc: x => ar(x) ?? big }[k];
  return arr.sort((a, b) => f(a) - f(b));
}

function cdHTML(s, end, start) {
  if (s === 'live' && end) return `<span class="cd" data-end="${end}"></span>`;
  if (s === 'upcoming' && start) return `<span>يبدأ ${date(start)}</span>`;
  return `<span>يغلق ${date(end)}</span>`;
}
function thumb(src, icon, href) {
  const img = src ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<a class="thumb" href="${esc(href)}" target="_blank" rel="noopener" tabindex="-1"><span class="ph">${icon}</span>${img}</a>`;
}
function srcLinks(list) { return list.map(([id, u]) => `<a class="src" href="${esc(u)}" target="_blank" rel="noopener">${SRC[id] ?? id} ↗</a>`).join(' · '); }

function auctionCard(a) {
  const loc = [a.d && 'حي ' + a.d.replace(/^حي\s+/, ''), a.ci.join('، ')].filter(Boolean).join('، ') || 'الموقع غير متوفر';
  const land = a.L ? `<span class="tag land">🟫 ${a.lc ? a.lc + (a.lc === 1 ? ' قطعة أرض' : ' قطع أراضٍ') : 'أراضٍ'}${a.la ? ' · ' + area(a.la) : ''}</span>` : '';
  const many = a.n > 1;
  const ICON = { real_estate: a.L ? '🟫' : '🏠', vehicle: '🚗', equipment: '🏗️', scrap: '♻️', collectible: '💎', other: '📦' }[a.c] ?? '📦';
  return `<article class="card has-img">${thumb(a.im, ICON, a.src[0][1])}<div class="body">
    <div class="tags"><span class="tag ${a.s}">${ST[a.s]}</span><span class="tag">${CAT[a.c] ?? a.c}</span>${land}${a.u.map(u => `<span class="tag">${US[u] ?? u}</span>`).join('')}${a.ml ? '<span class="tag multi">متعدد المواقع</span>' : ''}</div>
    <h3>${esc(a.t)}</h3>
    <div class="loc">📍 ${esc(loc)}</div>
    ${a.o ? `<div class="org">🏢 ${esc(a.o)}</div>` : ''}
    <div class="kv">
      <div><span>${a.cp ? 'آخر سعر' : many ? 'يبدأ من' : 'سعر البداية'}</span><b>${money(a.cp ?? a.sp)}</b></div>
      <div><span>العربون${many ? ' (من)' : ''}</span><b>${money(a.dp)}</b></div>
      <div><span>عدد الأصول</span><b>${a.n ?? '—'}</b></div>
    </div>
    <div class="foot">${cdHTML(a.s, a.en, a.st)}<span>${srcLinks(a.src)}</span></div>
  </div></article>`;
}
function assetCard(x) {
  const [pl, pi] = PT[x.pt] ?? ['غير محدد', '🏠'];
  const loc = [x.d && 'حي ' + x.d.replace(/^حي\s+/, ''), x.ci].filter(Boolean).join('، ') || (x.lat != null ? 'على الخريطة' : 'الموقع غير متوفر');
  const map = x.lat != null ? ` · <a class="src" href="https://www.google.com/maps?q=${x.lat},${x.lng}" target="_blank" rel="noopener">خريطة ↗</a>` : '';
  return `<article class="card has-img side">${thumb(x.im, pi, x.url)}<div class="body">
    <div class="tags"><span class="tag land">${pi} ${pl}</span>${x.u ? `<span class="tag">${US[x.u] ?? x.u}</span>` : ''}<span class="tag ${x.as}">${ST[x.as]}</span></div>
    <h3>${esc(x.t ?? x.at)}</h3>
    <div class="loc">📍 ${esc(loc)}${map}</div>
    <div class="kv">
      <div><span>المساحة</span><b>${area(x.ar)}</b></div>
      <div><span>${x.cp ? 'آخر سعر' : 'الافتتاح'}</span><b>${money(x.cp ?? x.sp)}</b></div>
      <div><span>العربون</span><b>${money(x.dp)}</b></div>
    </div>
    <div class="foot">${cdHTML(x.as, x.aen, x.ast)}<span class="org">🔨 ${esc(x.at)} · <a class="src" href="${esc(x.url)}" target="_blank" rel="noopener">${SRC[x.src] ?? x.src} ↗</a></span></div>
  </div></article>`;
}

function stat(label, v) { return `<div class="stat"><span>${label}</span><b>${v}</b></div>`; }

function render() {
  const v = S.view;
  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', a.dataset.v === v ? 'page' : 'false'));
  document.querySelectorAll('#geo button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === S.geo)));
  const isSrc = v === 'sources';
  $('controls').hidden = $('stats').hidden = $('count').hidden = $('list').hidden = isSrc;
  $('srcs').hidden = !isSrc; $('types').hidden = v !== 'properties';
  $('more').hidden = true;
  $('title').textContent = { lands: 'مزادات الأراضي', properties: 'الأصول العقارية', all: 'كل المزادات', sources: 'مصادر البيانات' }[v];
  $('sub').textContent = { lands: 'المزادات التي تحتوي قطعة أرض واحدة على الأقل، حسب موقع القطع نفسها', properties: 'كل عقار معروض في المزادات على حدة: أرض، فيلا، عمارة، استراحة…', all: 'كل المزادات الجارية والقادمة من جميع المنصات', sources: 'المنصات التي يجمع منها التطبيق البيانات وحالة الاتصال بكل منها' }[v];
  if (isSrc) {
    $('srcs').innerHTML = D.sources.map(s => `<div class="card"><h3><span class="dot ${s.s}"></span>${SRC[s.id] ?? s.n}</h3>
      <div class="loc">${s.s === 'ok' ? 'يعمل · آخر تحديث ' + date(s.ok) : s.s === 'blocked' ? 'محجوب عن خوادمنا حالياً' : 'خطأ'}</div>
      ${s.e ? `<div class="err">${esc(s.e)}</div>` : ''}</div>`).join('');
    return;
  }
  let items, html;
  if (v === 'properties') {
    const base = filtAssets(true);
    const counts = {}; base.forEach(x => { const k = x.pt ?? 'other'; counts[k] = (counts[k] || 0) + 1; });
    $('types').innerHTML = `<button class="chip" data-t="" aria-pressed="${!S.type}">الكل <small>${base.length}</small></button>` +
      Object.entries(PT).filter(([k]) => counts[k]).map(([k, [l, i]]) => `<button class="chip" data-t="${k}" aria-pressed="${S.type === k}">${i} ${l} <small>${counts[k]}</small></button>`).join('');
    items = sortBy(filtAssets(false), x => x.cp ?? x.sp, x => x.ar, x => x.aen);
    const lands = base.filter(x => x.pt === 'land');
    $('stats').innerHTML = stat('العقارات', base.length) + stat('قطع الأراضي', lands.length) + stat('مساحة الأراضي', area(lands.reduce((n, x) => n + (x.ar || 0), 0))) + stat('في مزادات جارية', base.filter(x => x.as === 'live').length);
    html = items.slice(0, S.shown).map(assetCard).join('');
    $('count').textContent = `${items.length} عقار`;
  } else {
    items = sortBy(filtAuctions(), a => a.cp ?? a.sp, a => a.la, a => a.en);
    const end = new Date(); const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh' }).format(end);
    const endsToday = items.filter(a => a.s === 'live' && a.en && new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh' }).format(new Date(a.en)) === today).length;
    $('stats').innerHTML = stat('المزادات', items.length) + stat('الجارية', items.filter(a => a.s === 'live').length) + stat('القادمة', items.filter(a => a.s === 'upcoming').length) + stat('تغلق اليوم', endsToday) +
      (v === 'lands' ? stat('قطع الأراضي', items.reduce((n, a) => n + (a.lc || 0), 0)) : '');
    html = items.slice(0, S.shown).map(auctionCard).join('');
    $('count').textContent = `${items.length} مزاد`;
  }
  $('list').innerHTML = html || `<div class="empty">لا توجد نتائج مطابقة. جرّب "منطقة الرياض" أو "كل المملكة"، أو امسح البحث.</div>`;
  $('more').hidden = items.length <= S.shown;
  tick();
}

function tick() {
  const now = Date.now();
  document.querySelectorAll('.cd').forEach(el => {
    const ms = new Date(el.dataset.end) - now;
    if (ms <= 0) { el.textContent = 'انتهى الوقت المسجل'; el.classList.remove('urgent'); return; }
    const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), p = n => String(n).padStart(2, '0');
    el.textContent = `يغلق خلال ${d ? d + ' يوم ' : ''}⁦${p(Math.floor(s % 86400 / 3600))}:${p(Math.floor(s % 3600 / 60))}:${p(s % 60)}⁩`;
    el.classList.toggle('urgent', ms < 3600000);
  });
}
setInterval(tick, 1000);

function route() { const h = location.hash.slice(1); S.view = ['lands', 'properties', 'all', 'sources'].includes(h) ? h : 'lands'; S.shown = 30; render(); }
window.addEventListener('hashchange', route);
$('geo').addEventListener('click', e => { const g = e.target.closest('button')?.dataset.g; if (!g) return; S.geo = g; S.shown = 30; try { localStorage.setItem('geo', g); } catch {} render(); });
$('types').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.type = b.dataset.t; S.shown = 30; render(); });
['q', 'status', 'usage', 'amin', 'amax', 'sort'].forEach(id => $(id).addEventListener('input', () => { S.shown = 30; render(); }));
$('more').addEventListener('click', () => { S.shown += 30; render(); });
route();
</script>

</body>
</html>
