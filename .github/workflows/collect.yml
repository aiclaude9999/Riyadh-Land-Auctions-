# Free hosting (Netlify + Neon): collect auctions into the database every 30 minutes.
# Needs the repository secret DATABASE_URL (Settings → Secrets and variables → Actions).
name: Collect auctions

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch: {}       # "Run workflow" button, also used by the app's "تحديث الآن"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL secret (Settings → Secrets and variables → Actions)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx prisma generate
      - name: Create / update database tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # migrations need a direct (non-pooled) connection: drop Neon's "-pooler" from the host
        run: DATABASE_URL="${DATABASE_URL/-pooler/}" npx prisma migrate deploy
      - name: Collect auctions
        run: npx tsx scripts/collect.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: warn
          LOG_PRETTY: "0"
          INGEST_CONCURRENCY: "10"
          DATABASE_POOL: "15"
