# Free hosting: every hour, collect the auctions and publish the page with GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions" (requires a public repository on a free plan).
name: Update auctions page

on:
  schedule:
    - cron: "17 * * * *"   # every hour (UTC), at minute 17
  workflow_dispatch: {}      # "Run workflow" button for a manual update
  push:
    branches: [ccr-684fffdf-bi3tdz, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx prisma generate
      - name: Collect auctions and build the page
        run: npx tsx scripts/build-static.ts
        env:
          LOG_LEVEL: warn
          LOG_PRETTY: "0"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
