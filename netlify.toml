# Netlify hosts the web app (Mazad Radar). Data is collected by GitHub Actions (collect.yml) into Neon.
# Environment variables to set in Netlify: DATABASE_URL, APP_PASSWORD (optional: GITHUB_TOKEN, GITHUB_REPO).
[build]
  command = "npx prisma generate && npx next build"

[build.environment]
  NODE_VERSION = "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  NEXT_TELEMETRY_DISABLED = "1"
